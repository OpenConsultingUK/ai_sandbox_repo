[project]
name = "fact"
version = "1.0.0"
# dynamic = ["version"]
description = "Example Python project using best practices"
authors = [
    { name = "John Hagen", email = "johnthagen@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE*"]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    # Prevent accidental publishing to PyPI
    "Private :: Do Not Upload",
]
requires-python = "==3.12.*"

dependencies = [
    "google-adk[tools-google-search]==0.1.0",
    "deprecated",
    "python-dotenv>=1.0.1",
    "rich", 
    "typer-slim[standard]",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.1",
]

[project.urls]
Homepage = "https://github.com/johnthagen/python-blueprint"
Documentation = "https://johnthagen.github.io/python-blueprint/"
Repository = "https://github.com/johnthagen/python-blueprint"

[project.scripts]
fact = "fact.cli:app"

[dependency-groups]
nox = [
    "nox-uv",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-randomly",
]
type_check = [
    "mypy",
    # Add "types-" stub packages as needed: https://github.com/python/typeshed/tree/main/stubs
]
lint = [
    "ruff",
]
docs = [
    "mkdocs-material",
    "mkdocs-htmlproofer-plugin",

    # Python API documentation (not necessary for applications).
    "mkdocstrings[python]",
    # Autodoc tools.
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
]
licenses = [
    "pip-licenses-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fact/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fact", "codeenigma_runtime"]

[tool.poetry]
name = "fact"
version = "0.0.1"

[tool.uv]
default-groups = "all"
# For non-package applications, uncomment below and remove [build-system]
# if you do not want it built or installed:
# package = false

[tool.mypy]
ignore_missing_imports = true
strict = true
enable_error_code = ["deprecated", "exhaustive-match", "explicit-override"]

[tool.ruff]
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
extend-ignore = [
    "RUF005",
    "RUF012",
]
unfixable = [
    # Don’t auto-remove unused imports except in CI (prevents editors from deleting imports mid-edit)
    "F401",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
xfail_strict = true
filterwarnings = [
    # Treat warnings as errors when running tests
    "error",
    # Example of ignoring deprecation warnings from third-party libs:
    # "ignore::DeprecationWarning:typer",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "case _ as unreachable",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
