# Default catch-all for unmatched hostnames
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/uss016.dev.openconsultinguk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uss016.dev.openconsultinguk.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    return 444;
}

# Main site - uss016.dev.openconsultinguk.com
server {
    listen 443 ssl;
    server_name uss016.dev.openconsultinguk.com;

    ssl_certificate /etc/letsencrypt/live/uss016.dev.openconsultinguk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uss016.dev.openconsultinguk.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Proxy requests to triage-agent (ADK web)
    location / {
        proxy_pass http://triage-agent-dev:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

# Optional: redirect HTTP to HTTPS
server {
    listen 80;
    server_name uss016.dev.openconsultinguk.com;
    return 301 https://$host$request_uri;
}
